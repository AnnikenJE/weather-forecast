<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="110" height="96">
  <!-- Ears (large, tilted outward) -->
  <g transform="translate(35 38) rotate(-18)">
    <ellipse cx="0" cy="0" rx="20" ry="24" fill="#c8b8e8"/>
    <ellipse cx="0" cy="3" rx="11" ry="15" fill="#f4c8e8"/>
  </g>
  <g transform="translate(125 38) rotate(18)">
    <ellipse cx="0" cy="0" rx="20" ry="24" fill="#c8b8e8"/>
    <ellipse cx="0" cy="3" rx="11" ry="15" fill="#f4c8e8"/>
  </g>

  <!-- Head (rounded top, narrower toward snout) -->
  <path d="
    M 80 24
    C 32 24, 18 58, 28 92
    C 38 118, 62 128, 80 128
    C 98 128, 122 118, 132 92
    C 142 58, 128 24, 80 24
    Z
  " fill="#c8b8e8"/>

  <!-- Snout (lighter highlight on lower face) -->
  <ellipse cx="80" cy="100" rx="26" ry="20" fill="#dcc8f0"/>

  <!-- Cheeks (blush) -->
  <ellipse cx="42" cy="92" rx="9" ry="5" fill="#f4a8d8" opacity="0.55"/>
  <ellipse cx="118" cy="92" rx="9" ry="5" fill="#f4a8d8" opacity="0.55"/>

  <!-- Eyes -->
  <circle cx="58" cy="68" r="7.5" fill="#1a0d2e"/>
  <circle cx="60" cy="65" r="2.5" fill="#ede0ff"/>
  <circle cx="56" cy="71" r="1" fill="#ede0ff"/>

  <circle cx="102" cy="68" r="7.5" fill="#1a0d2e"/>
  <circle cx="104" cy="65" r="2.5" fill="#ede0ff"/>
  <circle cx="100" cy="71" r="1" fill="#ede0ff"/>

  <!-- Nose -->
  <ellipse cx="80" cy="96" rx="6" ry="4.5" fill="#f4a8d8"/>

  <!-- Mouth -->
  <path d="M 80 100 L 80 107 M 80 107 Q 73 112 67 108 M 80 107 Q 87 112 93 108"
        stroke="#6a4a8a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Teeth -->
  <rect x="76.5" y="107" width="3" height="5" rx="1" fill="#ede0ff"/>
  <rect x="80.5" y="107" width="3" height="5" rx="1" fill="#ede0ff"/>

  <!-- Whiskers left -->
  <line x1="68" y1="98"  x2="30" y2="92"  stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="68" y1="102" x2="28" y2="104" stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="68" y1="106" x2="30" y2="118" stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="92" y1="98"  x2="130" y2="92"  stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="92" y1="102" x2="132" y2="104" stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="92" y1="106" x2="130" y2="118" stroke="#8a70aa" stroke-width="1.3" stroke-linecap="round"/>
</svg>
